services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins-ci
    restart: unless-stopped
    user: root

    ports:
      - "127.0.0.1:8082:8080"

    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/libri/LMS:/opt/libri/LMS:ro
      - /opt/libri/jenkins-workspace:/var/jenkins_home/workspace

    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock

volumes:
  jenkins_data:
