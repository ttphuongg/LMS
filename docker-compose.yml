services:
  postgres:
    image: postgres:16-alpine
    container_name: thuvien_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourPassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-LibraryManagementDB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-LibraryManagementDB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  api:
    image: lms-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thuvien_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - AdminSeed__Username=${ADMIN_USERNAME}
      - AdminSeed__Password=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - AdminSeed__Email=${ADMIN_EMAIL}
      - AdminSeed__FullName=${ADMIN_FULLNAME}
      - CloudflareR2__AccountId=${R2_ACCOUNT_ID}
      - CloudflareR2__AccessKeyId=${R2_ACCESS_KEY_ID}
      - CloudflareR2__SecretAccessKey=${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      - CloudflareR2__BucketName=${R2_BUCKET_NAME}
      - CloudflareR2__PublicUrl=${R2_PUBLIC_URL:-https://images.libri.id.vn}
      - Cors__AllowedOrigins__0=https://libri.id.vn
      - Cors__AllowedOrigins__1=http://localhost:5173
      - Cors__AllowedOrigins__2=http://127.0.0.1:5173
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL}
      - Smtp__FromName=${SMTP_FROM_NAME}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - FrontendUrl=${FRONTEND_URL:-https://libri.id.vn}
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
    name: thuvien_postgres_data
